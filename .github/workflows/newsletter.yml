name: Daily Tech Newsletter

on:
  schedule:
    # 한국 시간 평일 아침 9시 13분 실행 (안전망)
    - cron: '13 0 * * 1-5'
  workflow_dispatch: # 수동으로 즉시 실행할 수 있는 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
  
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install google-genai requests

    - name: Run Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        RECEIVER_EMAILS: ${{ secrets.RECEIVER_EMAILS }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 💡 Push 권한을 위해 추가
      run: |
        python send_newsletter.py # 💡 실제 스크립트 실행 명령어 추가
