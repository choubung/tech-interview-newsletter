name: Daily Tech Newsletter

on:
  schedule:
    # 매일 평일(월~금) 한국 시간 아침 9시 실행을 설정합니다.
    # GitHub Actions의 cron은 UTC(세계 표준시) 기준이므로, 
    # 한국 시간(UTC+9) 오전 9시는 UTC 기준 오전 0시입니다.
    - cron: '0 0 * * 1-5'
  workflow_dispatch: # 중요! 우리가 원할 때 수동으로 즉시 실행해볼 수 있는 버튼을 만듭니다.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install google-generativeai requests

    - name: Run Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        # 내 레포에 write하기 위해 3-1단계에서 등록한 PAT를 바인딩합니다.
        GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python send_newsletter.py
